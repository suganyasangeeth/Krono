<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" fill="none">
  <defs>
    <linearGradient id="goldL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A0"/>
      <stop offset="50%" stop-color="#E0B04E"/>
      <stop offset="100%" stop-color="#9A6B1E"/>
    </linearGradient>
    <filter id="shadowL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Mark (scale and center at 200, 200) -->
  <g transform="translate(30, 30) scale(0.66)" filter="url(#shadowL)">
    <path d="M 113.1 308.0 A 152 152 0 1 0 308.0 113.1"
          stroke="url(#goldL)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="148.5" cy="148.5" r="18" fill="url(#goldL)"/>
    <path d="M 218 186 L 218 326"
          stroke="url(#goldL)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 224 256 L 298 188"
          stroke="url(#goldL)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 224 256 L 304 324"
          stroke="url(#goldL)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Wordmark: K R O N O in outlined geometry -->
  <g transform="translate(420, 200)" fill="none" stroke="url(#goldL)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- K -->
    <g transform="translate(0, 0)">
      <line x1="0" y1="-80" x2="0" y2="80"/>
      <line x1="8" y1="0" x2="90" y2="-80"/>
      <line x1="8" y1="0" x2="96" y2="80"/>
    </g>
    <!-- R -->
    <g transform="translate(150, 0)">
      <line x1="0" y1="-80" x2="0" y2="80"/>
      <path d="M 0 -80 L 50 -80 C 80 -80 80 0 50 0 L 0 0"/>
      <line x1="45" y1="0" x2="95" y2="80"/>
    </g>
    <!-- O -->
    <g transform="translate(350, 0)">
      <circle cx="45" cy="0" r="76"/>
    </g>
    <!-- N -->
    <g transform="translate(530, 0)">
      <line x1="0" y1="-80" x2="0" y2="80"/>
      <line x1="0" y1="-80" x2="90" y2="80"/>
      <line x1="90" y1="-80" x2="90" y2="80"/>
    </g>
    <!-- O -->
    <g transform="translate(710, 0)">
      <circle cx="45" cy="0" r="76"/>
    </g>
  </g>
</svg>