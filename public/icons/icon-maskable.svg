<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="wineGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1126"/>
      <stop offset="50%" stop-color="#5A0B1A"/>
      <stop offset="100%" stop-color="#2C040B"/>
    </linearGradient>
    <linearGradient id="goldRingMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8DB80"/>
      <stop offset="45%" stop-color="#E0B04E"/>
      <stop offset="100%" stop-color="#9A6B1E"/>
    </linearGradient>
    <linearGradient id="goldKMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A0"/>
      <stop offset="100%" stop-color="#E9BE58"/>
    </linearGradient>
    <filter id="softShadowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.45"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#wineGradMask)"/>

  <!-- Scaled into safe zone (68% size centered at 256, 256) -->
  <g transform="translate(256, 256) scale(0.68) translate(-256, -256)" filter="url(#softShadowMask)">
    <path d="M 113.1 308.0 A 152 152 0 1 0 308.0 113.1"
          stroke="url(#goldRingMask)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="148.5" cy="148.5" r="18" fill="url(#goldRingMask)"/>
    <path d="M 218 186 L 218 326"
          stroke="url(#goldKMask)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 224 256 L 298 188"
          stroke="url(#goldKMask)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 224 256 L 304 324"
          stroke="url(#goldKMask)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>